<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MARENOSTRUM — Caviar d'exception</title>
  <meta name="description" content="MARENOSTRUM, maison de caviar et de délicatesses d'exception : caviar d'esturgeon et de saumon, poissons fumés, épicerie fine, sélectionnés en Hongrie. Fournisseur professionnel pour restaurants, hôtels et grossistes." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23111110'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' fill='%23F4EFE6' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="assets/css/style.css" />
  <script src="assets/js/image-slot.js"></script>
</head>
<body data-page="accueil">
  <div id="site-bg"></div>
  <div id="site-header"></div>

  <main>
    <!-- 1) HERO — plein écran, hero-montagne.jpg -->
    <div id="mn-hero-slot" data-hero></div>

    <!-- 2) BANDE IMMERSIVE — « L'eau vive », eau-vive.jpg -->
    <div id="mn-eau-vive-slot" data-eau-vive></div>

    <!-- 3) LA SÉLECTION — deux colonnes, grain-macro.jpg -->
    <div id="mn-selection-slot" data-selection></div>

    <!-- 3bis) NOS ESPÈCES — grille de cartes par espèce -->
    <div id="mn-especes-slot" data-especes></div>

    <!-- 4) LA GAMME / POUR LES PROFESSIONNELS — gamme-boites.jpg -->
    <div id="mn-gamme-pro-slot" data-gamme-pro></div>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/products.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/home.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.querySelector("[data-hero]").outerHTML = mnHomeHero();
      document.querySelector("[data-eau-vive]").outerHTML = mnHomeEauVive();
      document.querySelector("[data-selection]").outerHTML = mnHomeSelection();
      document.querySelector("[data-especes]").outerHTML = mnHomeEspeces();
      document.querySelector("[data-gamme-pro]").outerHTML = mnHomeGammePro();

      // mnMountLayout() already ran mnInitReveal() once on DOMContentLoaded, before any of the
      // sections above existed — their .reveal elements need their own pass (mnInitReveal skips
      // anything already bound via data-reveal-bound, so this only picks up what's new).
      mnInitReveal();
    });
  </script>
</body>
</html>
