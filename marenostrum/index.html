<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MARENOSTRUM — Maison de produits de la mer d'exception pour les professionnels</title>
  <meta name="description" content="MARENOSTRUM sélectionne, calibre et garantit caviar et produits de la mer d'exception pour les professionnels de la gastronomie et de la distribution sélective. Demande de référencement." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://mat97221.github.io/LYSARIS/index.html" />
  <meta property="og:title" content="MARENOSTRUM — Maison de produits de la mer d'exception pour les professionnels" />
  <meta property="og:description" content="Le caviar choisi, calibré, garanti — pour les tables qui ne pardonnent rien." />
  <meta property="og:image" content="https://mat97221.github.io/LYSARIS/assets/img/hero-mer.jpg" />
  <meta property="og:locale" content="fr_FR" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23111110'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' fill='%23F4EFE6' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body data-page="accueil">
  <div id="site-bg"></div>
  <div id="site-header"></div>

  <main>
    <div id="mn-hero-slot" data-hero></div>
    <div id="mn-texture-slot" data-texture></div>
    <div id="mn-maison-slot" data-maison></div>
    <div id="mn-table-slot" data-table></div>
    <div id="mn-savoir-faire-slot" data-savoir-faire></div>
    <div id="mn-contact-slot" data-contact></div>
  </main>

  <div id="site-footer"></div>

  <!-- Lenis (défilement lissé) + GSAP/ScrollTrigger — chargés uniquement sur cet accueil
       one-page ; aucune autre page du site n'en dépend. -->
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>

  <script src="assets/js/ui.js"></script>
  <script src="assets/js/motion.js"></script>
  <script src="assets/js/home.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.querySelector("[data-hero]").outerHTML = mnHomeHero();
      document.querySelector("[data-texture]").outerHTML = mnHomeTextureBand();
      document.querySelector("[data-maison]").outerHTML = mnSectionMaison();
      document.querySelector("[data-table]").outerHTML = mnSectionTable();
      document.querySelector("[data-savoir-faire]").outerHTML = mnSectionSavoirFaire();
      document.querySelector("[data-contact]").outerHTML = mnSectionContact();

      document.querySelectorAll("[data-tin-reveal]").forEach((el) => {
        el.outerHTML = mnTinReveal();
      });

      mnInitContactIcons();
      mnInitContactForm();
      mnInitProduitCTAs();

      // mnInitMotion() (Lenis + GSAP/ScrollTrigger) doit s'exécuter une fois toutes les sections
      // ci-dessus réellement présentes dans le DOM, faute de quoi les ScrollTrigger seraient
      // créés sur des éléments absents.
      mnInitMotion();

      // Arrivée directe sur une ancre ou avec un produit à pré-remplir (lien partagé, ou retour
      // depuis fiche-technique-produit.html / conditions-professionnelles.html) : le navigateur
      // ne peut pas sauter nativement vers une section injectée après coup, donc on le fait ici.
      const produit = new URLSearchParams(window.location.search).get("produit");
      if (produit) mnPrefillProduit(produit);
      if (window.location.hash) {
        requestAnimationFrame(() => mnScrollTo(window.location.hash));
      }
    });
  </script>
</body>
</html>
