<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Votre panier — MARENOSTRUM</title>
  <meta name="description" content="Votre panier MARENOSTRUM." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23111110'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' fill='%23C4A35A' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body data-page="panier">
  <div id="site-bg"></div>
  <div id="site-header"></div>

  <main>
    <section class="border-b border-ink-600/50 bg-ink-800">
      <div class="container-page py-16">
        <p class="eyebrow mb-3">Étape 1 sur 3</p>
        <h1 class="h-page">Votre panier</h1>
      </div>
    </section>

    <section class="container-page py-20">
      <div id="mn-cart-empty" class="hidden py-16 text-center reveal">
        <p class="h-card mb-4">Votre panier est vide</p>
        <p class="text-ink-200 mb-8">Découvrez nos caviars d'exception et composez votre sélection.</p>
        <a href="boutique.html" class="btn-navy">Voir la boutique</a>
      </div>

      <div id="mn-cart-filled" class="hidden grid grid-cols-1 gap-10 lg:grid-cols-3">
        <div class="lg:col-span-2 flex flex-col gap-4" id="mn-cart-lines"></div>

        <aside class="rounded-md border border-ink-600/60 bg-ink-700 p-7 h-fit">
          <h2 class="h-card mb-6">Récapitulatif</h2>
          <div class="flex justify-between text-sm text-ink-200 mb-3">
            <span>Sous-total</span>
            <span id="mn-summary-subtotal" class="text-ink-50"></span>
          </div>
          <div class="flex justify-between text-sm text-ink-200 mb-3">
            <span>Livraison réfrigérée</span>
            <span id="mn-summary-shipping" class="text-ink-50"></span>
          </div>
          <p id="mn-summary-freeship" class="text-xs text-navy mb-4"></p>
          <div class="flex justify-between border-t border-ink-600/60 pt-4 mb-7 font-titre text-xl">
            <span class="text-ink-50">Total</span>
            <span id="mn-summary-total" class="text-navy"></span>
          </div>
          <a href="paiement.html" class="btn-navy w-full">Passer commande</a>
          <a href="boutique.html" class="btn-ghost w-full mt-2 justify-center">Continuer mes achats</a>
        </aside>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/products.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/ui.js"></script>
  <script>
    function mnRenderCartLine(line) {
      return `
      <div class="flex gap-5 rounded-md border border-ink-600/60 bg-ink-700 p-5" data-sku="${line.variant.sku}">
        <div class="flex h-24 w-24 shrink-0 items-center justify-center rounded-sm bg-ink-800">
          <div class="h-16 w-16">${mnTinSVG(line.product.tint)}</div>
        </div>
        <div class="flex flex-1 flex-col justify-between">
          <div class="flex items-start justify-between gap-3">
            <div>
              <a href="produit.html?id=${line.product.id}" class="font-titre text-lg text-ink-50 hover:text-navy">${line.product.name}</a>
              <p class="text-xs text-ink-300 mt-1">${line.variant.size}</p>
            </div>
            <button type="button" class="mn-remove-line h-5 w-5 text-ink-300 hover:text-error shrink-0" aria-label="Retirer ${line.product.name} du panier">${MN_ICONS.trash}</button>
          </div>
          <div class="flex items-center justify-between mt-3">
            <div class="flex items-center gap-2 rounded-sm border border-ink-500">
              <button type="button" class="mn-line-minus flex h-9 w-9 items-center justify-center text-ink-100 hover:text-navy" aria-label="Diminuer la quantité">
                <span class="h-3.5 w-3.5 block">${MN_ICONS.minus}</span>
              </button>
              <span class="min-w-[2ch] text-center text-sm text-ink-50">${line.qty}</span>
              <button type="button" class="mn-line-plus flex h-9 w-9 items-center justify-center text-ink-100 hover:text-navy" aria-label="Augmenter la quantité">
                <span class="h-3.5 w-3.5 block">${MN_ICONS.plus}</span>
              </button>
            </div>
            <span class="font-semibold text-ink-50">${mnFormatPrice(line.lineTotal)}</span>
          </div>
        </div>
      </div>`;
    }

    function mnRenderCart() {
      const lines = MnCart.detailedLines();
      const empty = document.getElementById("mn-cart-empty");
      const filled = document.getElementById("mn-cart-filled");

      if (lines.length === 0) {
        empty.classList.remove("hidden");
        filled.classList.add("hidden");
        return;
      }
      empty.classList.add("hidden");
      filled.classList.remove("hidden");

      document.getElementById("mn-cart-lines").innerHTML = lines.map(mnRenderCartLine).join("");

      document.querySelectorAll(".mn-remove-line").forEach((btn, i) => {
        btn.addEventListener("click", () => {
          MnCart.remove(lines[i].sku);
          mnRenderCart();
        });
      });
      document.querySelectorAll(".mn-line-minus").forEach((btn, i) => {
        btn.addEventListener("click", () => {
          MnCart.updateQty(lines[i].sku, lines[i].qty - 1);
          mnRenderCart();
        });
      });
      document.querySelectorAll(".mn-line-plus").forEach((btn, i) => {
        btn.addEventListener("click", () => {
          MnCart.updateQty(lines[i].sku, lines[i].qty + 1);
          mnRenderCart();
        });
      });

      const totals = MnCart.totals();
      document.getElementById("mn-summary-subtotal").textContent = mnFormatPrice(totals.subtotal);
      document.getElementById("mn-summary-shipping").textContent = totals.shipping === 0 ? "Offerte" : mnFormatPrice(totals.shipping);
      document.getElementById("mn-summary-total").textContent = mnFormatPrice(totals.total);

      const freeshipEl = document.getElementById("mn-summary-freeship");
      if (totals.shipping === 0) {
        freeshipEl.textContent = "Livraison offerte sur cette commande.";
      } else {
        freeshipEl.textContent = `Plus que ${mnFormatPrice(totals.freeShippingRemaining)} pour la livraison offerte.`;
      }
    }

    document.addEventListener("DOMContentLoaded", mnRenderCart);
    window.addEventListener("mn:cart-updated", mnRenderCart);
  </script>
</body>
</html>
