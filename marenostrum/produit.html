<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="mn-page-title">Produit — MARENOSTRUM</title>
  <meta name="description" content="Fiche produit MARENOSTRUM." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23111110'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' fill='%23F4EFE6' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="assets/css/style.css" />
  <script src="assets/js/image-slot.js"></script>
</head>
<body data-page="boutique">
  <div id="site-bg"></div>
  <div id="site-header"></div>

  <main>
    <div id="mn-product-not-found" class="hidden container-page py-28 text-center">
      <p class="eyebrow mb-3">Oups</p>
      <h1 class="h-card mb-4">Produit introuvable</h1>
      <p class="text-ink-200 mb-8">Ce produit n'existe pas ou n'est plus disponible.</p>
      <a href="boutique.html" class="btn-navy">Retour à la boutique</a>
    </div>

    <div id="mn-product-content" class="hidden">
      <section class="border-b border-ink-600/50">
        <div class="container-page py-4 text-xs text-ink-300">
          <a href="index.html" class="hover:text-marine">Accueil</a>
          <span class="mx-2">/</span>
          <a href="boutique.html" class="hover:text-marine">Boutique</a>
          <span class="mx-2">/</span>
          <span id="mn-breadcrumb-name" class="text-ink-100"></span>
        </div>
      </section>

      <section class="container-page grid grid-cols-1 gap-12 py-20 lg:grid-cols-2 lg:gap-16">
        <div class="reveal relative flex h-96 items-center justify-center overflow-hidden bg-gradient-to-b from-marine to-noir">
          <div id="mn-product-badge-slot"></div>
          <image-slot id="mn-product-photo" shape="rect" placeholder="Photo produit" style="width:100%;height:100%"></image-slot>
        </div>

        <div class="reveal [transition-delay:260ms]">
          <p id="mn-product-species" class="eyebrow mb-3"></p>
          <h1 class="h-section mb-3">
            <span id="mn-product-name"></span>
            <span id="mn-product-latin" class="block sm:inline text-xl sm:text-2xl italic text-ink-300 font-texte"></span>
          </h1>
          <p id="mn-product-tagline" class="text-ink-200 text-lg mb-8"></p>

          <div class="mb-8">
            <p class="field-label">Format</p>
            <div id="mn-variant-options" class="flex flex-wrap gap-3"></div>
          </div>

          <a id="mn-product-quote-link" href="contact.html" class="btn-navy w-full sm:w-auto">Demander un devis</a>
          <p class="mt-3 text-xs text-ink-300">Devis personnalisé sous 48h selon quantité et destination.</p>

          <div class="mt-10 border-t border-ink-600/50 pt-8">
            <p id="mn-product-description" class="prose-copy"></p>
          </div>

          <div id="mn-tasting-block" class="mt-8">
            <p class="eyebrow mb-3">Notes de dégustation</p>
            <p id="mn-tasting-notes" class="text-sm text-ink-300"></p>
          </div>

          <div id="mn-pairing-block" class="mt-8">
            <p class="eyebrow mb-3">Suggestion d'accord</p>
            <p id="mn-pairing-text" class="text-ink-200"></p>
          </div>

          <dl class="mt-8 grid grid-cols-1 gap-4 border-t border-ink-600/50 pt-8 sm:grid-cols-2">
            <div>
              <dt class="field-label">Origine</dt>
              <dd id="mn-product-origin" class="text-ink-100 text-sm"></dd>
            </div>
            <div id="mn-affinage-block">
              <dt class="field-label">Affinage</dt>
              <dd id="mn-product-affinage" class="text-ink-100 text-sm"></dd>
            </div>
          </dl>
        </div>
      </section>

      <section class="border-t border-ink-600/50 bg-ink-800">
        <div class="container-page py-24">
          <h2 class="h-section mb-10">Vous aimerez aussi</h2>
          <div id="mn-related-grid" class="grid grid-cols-1 gap-8 sm:grid-cols-2 lg:grid-cols-4"></div>
        </div>
      </section>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/products.js"></script>
  <script src="assets/js/ui.js"></script>
  <script>
    let mnSelectedSku = null;

    function mnRenderVariants(product) {
      const wrap = document.getElementById("mn-variant-options");
      wrap.innerHTML = product.variants
        .map(
          (v, idx) =>
            `<button type="button" data-sku="${v.sku}" class="mn-variant-btn border px-4 py-2.5 min-h-[44px] text-sm transition-all duration-200 ease-fluid ${
              idx === 0 ? "border-navy text-marine" : "border-ink-500 text-ink-100 hover:border-navy/60"
            }">${v.size}</button>`
        )
        .join("");

      wrap.querySelectorAll(".mn-variant-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          mnSelectedSku = btn.dataset.sku;
          wrap.querySelectorAll(".mn-variant-btn").forEach((b) => {
            b.classList.remove("border-navy", "text-marine");
            b.classList.add("border-ink-500", "text-ink-100");
          });
          btn.classList.remove("border-ink-500", "text-ink-100");
          btn.classList.add("border-navy", "text-marine");
        });
      });

      mnSelectedSku = product.variants[0].sku;
    }

    function mnRenderProduct(product) {
      document.title = `${product.name} — MARENOSTRUM`;
      document.getElementById("mn-page-title").textContent = `${product.name} — MARENOSTRUM`;
      document.getElementById("mn-breadcrumb-name").textContent = product.name;
      const categoryLabel = MARENOSTRUM_CATEGORIES.find((c) => c.id === product.category);
      document.getElementById("mn-product-species").textContent = categoryLabel ? categoryLabel.label : "MARENOSTRUM";
      document.getElementById("mn-product-name").textContent = product.name;
      document.getElementById("mn-product-latin").textContent = product.species ? `(${product.species})` : "";
      document.getElementById("mn-product-tagline").textContent = product.tagline;
      document.getElementById("mn-product-description").textContent = product.description;
      document.getElementById("mn-product-origin").textContent = product.origin || "—";

      const affinageBlock = document.getElementById("mn-affinage-block");
      if (product.affinage) {
        document.getElementById("mn-product-affinage").textContent = product.affinage;
        affinageBlock.classList.remove("hidden");
      } else {
        affinageBlock.classList.add("hidden");
      }

      const tastingBlock = document.getElementById("mn-tasting-block");
      if (product.tastingNotes && product.tastingNotes.length) {
        document.getElementById("mn-tasting-notes").textContent = product.tastingNotes.join(" · ");
        tastingBlock.classList.remove("hidden");
      } else {
        tastingBlock.classList.add("hidden");
      }

      const pairingBlock = document.getElementById("mn-pairing-block");
      if (product.pairing) {
        document.getElementById("mn-pairing-text").textContent = product.pairing;
        pairingBlock.classList.remove("hidden");
      } else {
        pairingBlock.classList.add("hidden");
      }

      document.getElementById("mn-product-badge-slot").innerHTML = product.badge
        ? `<span class="absolute left-0 top-0 px-4 py-2 text-xs font-semibold uppercase tracking-widest2 text-ivoire/80">${product.badge}</span>`
        : "";

      mnRenderVariants(product);

      document.getElementById("mn-product-quote-link").href = `contact.html?produit=${encodeURIComponent(product.name)}`;

      const related = MARENOSTRUM_PRODUCTS.filter((p) => p.category === product.category && p.id !== product.id).slice(0, 4);
      const relatedGrid = document.getElementById("mn-related-grid");
      relatedGrid.innerHTML = related.map(mnProductCard).join("") || `<p class="text-ink-300 col-span-full">Découvrez le reste de notre gamme en boutique.</p>`;
      mnStagger(relatedGrid, 70);
    }

    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const product = mnFindProduct(params.get("id"));

      if (!product) {
        document.getElementById("mn-product-not-found").classList.remove("hidden");
        return;
      }
      document.getElementById("mn-product-content").classList.remove("hidden");
      mnRenderProduct(product);
    });
  </script>
</body>
</html>
