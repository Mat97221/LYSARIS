    <section class="border-b border-ink-600/50">

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Catalogue resserré à 4 espèces de caviar (voir products.js) : plus qu'une seule
      // catégorie, donc plus de filtres à afficher — la grille montre tout le catalogue,
      // les produits mis en avant (badge Best-seller/Édition limitée) en tête.
      const grid = document.getElementById("mn-product-grid");
      const items = [...MARENOSTRUM_PRODUCTS].sort((a, b) => (a.badge ? 0 : 1) - (b.badge ? 0 : 1));
      grid.innerHTML = items.map(mnProductCard).join("");
      mnStagger(grid, 70);
    });
  </script>
